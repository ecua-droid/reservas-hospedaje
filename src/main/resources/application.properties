spring.application.name=reservas-hospedaje

server.port=8080

# ------------------------------------------------------------------
# Conexion a PostgreSQL
# La contrasena NO se escribe en este archivo (se publica en GitHub).
# Se toma de:
#   1) el archivo src/main/resources/db-local.properties (ignorado por Git), o
#   2) la variable de entorno DB_PASSWORD.
# Ver README.md -> "Configuracion de PostgreSQL".
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas_hospedaje}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:classpath:db-local.properties

# ------------------------------------------------------------------
# JPA / Hibernate
# La estructura oficial se crea con database/01_estructura.sql.
# "update" solo agrega lo que falte; no borra datos.
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
