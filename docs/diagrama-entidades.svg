<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Arial, sans-serif">
  <title>Diagrama de entidades: Habitacion 1 a N Reserva</title>
  <rect width="900" height="470" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#15433f">Reservas de habitaciones - Diagrama de entidades</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#5d6d6a">Una habitación puede tener muchas reservas en diferentes fechas (1 : N)</text>

  <!-- ===== HABITACION ===== -->
  <g transform="translate(40,90)">
    <rect width="300" height="262" rx="10" fill="#f5f3ee" stroke="#1f5f5b" stroke-width="2"/>
    <rect width="300" height="38" rx="10" fill="#1f5f5b"/>
    <rect y="28" width="300" height="10" fill="#1f5f5b"/>
    <text x="150" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">HABITACION</text>
    <g font-size="13" fill="#23312f">
      <text x="14" y="64"><tspan font-weight="700" fill="#b07d22">PK</tspan>  id : BIGINT</text>
      <text x="14" y="90"><tspan font-weight="700" fill="#1f5f5b">UK</tspan>  numero : VARCHAR(10)</text>
      <text x="14" y="116">     tipo : VARCHAR(20)</text>
      <text x="14" y="142">     capacidad : INTEGER</text>
      <text x="14" y="168">     tarifa_noche : NUMERIC(10,2)</text>
      <text x="14" y="194">     descripcion : VARCHAR(200)</text>
      <text x="14" y="220">     activa : BOOLEAN</text>
    </g>
    <text x="14" y="248" font-size="11" fill="#5d6d6a">CHECK: tipo válido, capacidad 1-10, tarifa &gt; 0</text>
  </g>

  <!-- ===== RESERVA ===== -->
  <g transform="translate(540,74)">
    <rect width="320" height="372" rx="10" fill="#f5f3ee" stroke="#1f5f5b" stroke-width="2"/>
    <rect width="320" height="38" rx="10" fill="#1f5f5b"/>
    <rect y="28" width="320" height="10" fill="#1f5f5b"/>
    <text x="160" y="25" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">RESERVA</text>
    <g font-size="13" fill="#23312f">
      <text x="14" y="62"><tspan font-weight="700" fill="#b07d22">PK</tspan>  id : BIGINT</text>
      <text x="14" y="86"><tspan font-weight="700" fill="#c0392b">FK</tspan>  habitacion_id : BIGINT</text>
      <text x="14" y="110">     nombre_huesped : VARCHAR(100)</text>
      <text x="14" y="134">     documento_huesped : VARCHAR(20)</text>
      <text x="14" y="158">     telefono_huesped : VARCHAR(15)</text>
      <text x="14" y="182">     cantidad_huespedes : INTEGER</text>
      <text x="14" y="206">     fecha_entrada : DATE</text>
      <text x="14" y="230">     fecha_salida : DATE</text>
      <text x="14" y="254">     noches : INTEGER</text>
      <text x="14" y="278">     tarifa_noche : NUMERIC(10,2)</text>
      <text x="14" y="302">     total : NUMERIC(12,2)</text>
      <text x="14" y="326">     estado : ACTIVA | CANCELADA | FINALIZADA</text>
    </g>
    <text x="14" y="350" font-size="11" fill="#5d6d6a">CHECK: salida &gt; entrada, total = noches × tarifa</text>
    <text x="14" y="364" font-size="11" fill="#5d6d6a">EXCLUDE: sin traslapes de reservas ACTIVAS</text>
  </g>

  <!-- ===== RELACION 1 : N ===== -->
  <line x1="340" y1="176" x2="540" y2="160" stroke="#1f5f5b" stroke-width="2"/>
  <!-- lado 1 (dos barras) -->
  <line x1="356" y1="164" x2="358" y2="186" stroke="#1f5f5b" stroke-width="2"/>
  <line x1="366" y1="163" x2="368" y2="185" stroke="#1f5f5b" stroke-width="2"/>
  <!-- lado N (pata de gallo) -->
  <line x1="516" y1="162" x2="540" y2="148" stroke="#1f5f5b" stroke-width="2"/>
  <line x1="516" y1="162" x2="540" y2="172" stroke="#1f5f5b" stroke-width="2"/>
  <line x1="512" y1="150" x2="514" y2="174" stroke="#1f5f5b" stroke-width="2"/>
  <text x="352" y="152" font-size="14" font-weight="700" fill="#15433f">1</text>
  <text x="520" y="140" font-size="14" font-weight="700" fill="#15433f">N</text>
  <text x="440" y="200" text-anchor="middle" font-size="13" fill="#23312f">tiene</text>
  <text x="440" y="218" text-anchor="middle" font-size="11" fill="#5d6d6a">reserva.habitacion_id → habitacion.id</text>
</svg>
